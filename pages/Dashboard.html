<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard IoT - ESP32 + Mosquitto</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
</head>
<body>

  <h1>📊 Monitoramento IoT em Tempo Real</h1>
  <div id="status" class="status disconnected">Status: Desconectado</div>

  <div class="cards-container">
    <div class="card">
      <h3>Temperatura</h3>
      <div class="value"><span id="temp">--</span> <span class="unit">°C</span></div>
    </div>

    <div class="card">
      <h3>Umidade</h3>
      <div class="value"><span id="hum">--</span> <span class="unit">%</span></div>
    </div>

    <div class="card">
      <h3>Qualidade do Ar</h3>
      <div class="value"><span id="air">--</span></div>
    </div>
  </div>

  <script>
    const MQTT_HOST = "10.0.0.252"; 
    const MQTT_PORT = 9001; 

    const TOPIC_TEMP = "aulas/grupo5Lucas/temperatura";
    const TOPIC_HUM  = "aulas/grupo5Lucas/umidade";
    const TOPIC_AIR  = "aulas/grupo5Lucas/qualidade_ar";

    const clientID = "WebDash_" + Math.random().toString(16).substr(2, 8);

    const client = new Paho.MQTT.Client(MQTT_HOST, Number(MQTT_PORT), clientID);

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    client.connect({
      onSuccess: onConnect,
      onFailure: onFailure
    });

    function onConnect() {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "Status: Conectado ao Mosquitto";
      statusDiv.className = "status connected";

      client.subscribe(TOPIC_TEMP);
      client.subscribe(TOPIC_HUM);
      client.subscribe(TOPIC_AIR);
    }

    function onFailure(responseObject) {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "Status: Falha na conexão (" + responseObject.errorMessage + ")";
      statusDiv.className = "status disconnected";
    }

    function onConnectionLost(responseObject) {
      if (responseObject.errorCode !== 0) {
        const statusDiv = document.getElementById("status");
        statusDiv.innerText = "Status: Conexão Perdida";
        statusDiv.className = "status disconnected";
      }
    }

    function onMessageArrived(message) {
      const topic = message.destinationName;
      const payload = message.payloadString;

      if (topic === TOPIC_TEMP) {
        document.getElementById("temp").innerText = payload;
      } else if (topic === TOPIC_HUM) {
        document.getElementById("hum").innerText = payload;
      } else if (topic === TOPIC_AIR) {
        document.getElementById("air").innerText = payload;
      }
    }
  </script>
</body>
</html>
